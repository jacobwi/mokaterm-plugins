name: Live

# The live tests the plugins carry (network against 1.1.1.1 and github.com, TLS against cloudflare.com) never run in a
# pull request, because a runner's network says more about the runner than about the code. Once a night they do run, so
# an operating-system or resolver change that breaks a probe is caught while it is still fresh. Nothing here publishes.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  live:
    name: Live network and TLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mokaterm-plugins

    steps:
      - name: Check out the gallery
        uses: actions/checkout@v5
        with:
          path: mokaterm-plugins
          persist-credentials: false

      - name: Find the Mokaterm to build against
        id: mokaterm
        run: python3 -B build/gallery.py mokaterm-ref >> "$GITHUB_OUTPUT"

      - name: Check out Mokaterm
        uses: actions/checkout@v5
        with:
          repository: jacobwi/Mokaterm
          ref: ${{ steps.mokaterm.outputs.ref }}
          path: Mokaterm
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Make the Mokaterm packages available
        run: python3 -B build/mokaterm_feed.py

      # Stable targets, not the runners' own: the resolvers the plugin's client is written for, a registry that answers
      # whois, and a CDN edge with a current certificate. A failure here is a finding, not a flake to retry blind.
      - name: Run the live tests
        run: |
          dotnet test plugins/moka.network/tests -v q
          dotnet test plugins/moka.certificates/tests -v q
        env:
          MOKA_NETWORK_LIVE: "1"
          MOKA_CERTIFICATES_TLS_HOST: "cloudflare.com"
